[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ehos-common"
version = "0.1.0"
description = "EHOS cross-cutting library: config, logging, API envelope, events, security, db, kafka, redis"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "aiokafka>=0.11",
    "redis>=5.0",
    "cryptography>=42.0",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
db = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"