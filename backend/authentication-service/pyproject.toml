[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authentication-service"
version = "0.1.0"
description = "EHOS authentication-service: JWT, refresh tokens, RBAC, ABAC, MFA, password policies, sessions, audit, SSO-ready OIDC"
requires-python = ">=3.11"
dependencies = [
    "ehos-common==0.1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "bcrypt>=4.0",
    "pyotp>=2.9",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
test = ["aiosqlite>=0.20", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]