[project]
name = "ehos-inventory-service"
version = "0.1.0"
description = "EHOS Inventory Service — stock, movements, expiry, reorder"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "python-json-logger>=2.0.7",
    "httpx>=0.28.0",
    "aiokafka>=0.10.0",

]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "tzdata>=2025.2",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "ANN", "ARG", "PTH", "SIM", "T20"]
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ARG001", "ARG002", "PTH118", "T201", "T203", "B008", "B904", "E501", "F401", "UP045", "I001", "W292"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "ARG001", "ANN001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"
