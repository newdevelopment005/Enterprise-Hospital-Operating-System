[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analytics-service"
version = "0.1.0"
description = "EHOS analytics-service: multi-department executive KPIs (finance, HR, operations, pharmacy, laboratory) with country/currency/timezone localization"
requires-python = ">=3.11"
dependencies = [
    "ehos-common==0.1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
test = ["aiosqlite>=0.20", "httpx>=0.27", "pytest>=8.0", "pytest-asyncio>=0.23", "tzdata>=2024.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
