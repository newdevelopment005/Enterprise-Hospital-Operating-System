# EHOS scraping targets
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - ./rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Services export metrics at /metrics. Prometheus runs inside the compose
  # network by default (monitoring/ directory mounted).
  - job_name: ehos-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - configuration-service:8100
          - audit-service:8200
          - notification-service:8300

  - job_name: keycloak
    static_configs:
      - targets: ["keycloak:8080"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]