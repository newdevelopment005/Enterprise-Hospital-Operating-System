name: Phase 0 CI

on:
  push:
    branches: [main, develop]
  pull_request:

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Lint & test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend/api-gateway
          - backend/authentication-service
          - backend/configuration-service
          - backend/audit-service
          - backend/notification-service
          - backend/patient-service
          - backend/ehr-service
          - backend/knowledge-service
          - backend/ai-service
          - backend/prediction-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ../../shared/ehos-common
          pip install -e .[dev] || pip install -e .
          pip install ruff pytest pytest-asyncio

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: ruff check src tests

      - name: Test
        working-directory: ${{ matrix.service }}
        run: pytest -q

  build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build all Phase 0 services
        run: |
          for svc in api-gateway authentication-service configuration-service audit-service notification-service patient-service ehr-service knowledge-service ai-service prediction-service; do
            docker build \
              -f backend/$svc/Dockerfile \
              -t ehos/$svc:${{ github.sha }} .
          done

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/api-gateway/Dockerfile

      - name: Build images for scanning
        run: |
          for svc in api-gateway authentication-service configuration-service audit-service notification-service patient-service ehr-service knowledge-service ai-service prediction-service; do
            docker build -f backend/$svc/Dockerfile -t ehos/$svc:latest .
          done

      - name: Container scan (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: image
          image-ref: ehos/api-gateway:latest
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif