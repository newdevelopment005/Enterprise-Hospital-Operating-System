# EHOS production edge: HAProxy terminates TLS and load-balances to NGINX.
# In Kubernetes this role is replaced by the k8s ingress (see haproxy + ingress in
# infrastructure/kubernetes). keepalived on the host provides the VIP in HA pairs.

global
  log stdout format raw local0
  maxconn 50000
  ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384
  ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client  120s
  timeout server  120s

frontend http-in
  bind *:80
  http-request redirect scheme https unless { ssl_fc }
  default_backend nginx-pool

frontend https-in
  bind *:443 ssl crt /usr/local/etc/haproxy/certs/hospital.pem alpn h2,http/1.1
  http-request set-header X-Forwarded-Proto https
  default_backend nginx-pool

backend nginx-pool
  balance roundrobin
  option httpchk GET /healthz
  server nginx-1 nginx:8080 check inter 5s fall 3 rise 2