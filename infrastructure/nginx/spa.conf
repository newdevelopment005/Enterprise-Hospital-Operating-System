server {
  listen 8080;
  server_name _;

  location = /healthz {
    access_log off;
    return 200 'ok\n';
  }

  # Single public API surface -> api-gateway (which routes/authenticates).
  location /api/ {
    proxy_pass http://api-gateway:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
  }

  # --- SPA apps (history-mode fallback) ---
  location /ehr/        { alias /usr/share/nginx/html/ehr/;        try_files $uri $uri/ /ehr/index.html; }
  location /register/   { alias /usr/share/nginx/html/register/;   try_files $uri $uri/ /register/index.html; }
  location /dash/       { alias /usr/share/nginx/html/dash/;       try_files $uri $uri/ /dash/index.html; }
  location /assistant/  { alias /usr/share/nginx/html/assistant/;  try_files $uri $uri/ /assistant/index.html; }

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;

  location / { return 302 https://$host/dash/; }
}