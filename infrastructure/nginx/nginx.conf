# EHOS production NGINX reverse proxy (stand-in for the k8s ingress in the
# single-host Docker deployment). Serves the SPA builds and proxies /api to the
# api-gateway. TLS terminates at HAProxy on the edge, so no TLS here.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;

events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout  65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Block public access to internal API docs except through the gateway
  proxy_hide_header X-Powered-By;

  include /etc/nginx/conf.d/*.conf;
}