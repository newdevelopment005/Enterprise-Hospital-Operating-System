      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8500:8500"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  appointment-service:
    build:
      context: ..
      dockerfile: backend/appointment-service/Dockerfile
    container_name: ehos-appointment-service
    env_file: ../.env
    environment:
