      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

  ehr-service:
    build:
      context: ..
      dockerfile: backend/ehr-service/Dockerfile
    container_name: ehos-ehr-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8502:8502"
    depends_on:
      postgres:
        condition: service_healthy

  authentication-service:
    build:
      context: ..
      dockerfile: backend/authentication-service/Dockerfile
    container_name: ehos-authentication-service
    env_file: ../.env
