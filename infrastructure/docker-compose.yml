  queue-service:
    build:
      context: ..
      dockerfile: backend/queue-service/Dockerfile
    container_name: ehos-queue-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8504:8504"
    depends_on:
      postgres:
        condition: service_healthy

  billing-service:
    build:
      context: ..
      dockerfile: backend/billing-service/Dockerfile
    container_name: ehos-billing-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8509:8509"
    depends_on:
      postgres:
        condition: service_healthy

  prescription-service:
    build:
      context: ..
      dockerfile: backend/prescription-service/Dockerfile
    container_name: ehos-prescription-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8510:8510"
    depends_on:
      postgres:
        condition: service_healthy

  pharmacy-service:
    build:
      context: ..
      dockerfile: backend/pharmacy-service/Dockerfile
    container_name: ehos-pharmacy-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8511:8511"
    depends_on:
      postgres:
        condition: service_healthy

  laboratory-service:
    build:
      context: ..
      dockerfile: backend/laboratory-service/Dockerfile
    container_name: ehos-laboratory-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8512:8512"
    depends_on:
      postgres:
        condition: service_healthy

  radiology-service:
    build:
      context: ..
      dockerfile: backend/radiology-service/Dockerfile
    container_name: ehos-radiology-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8513:8513"
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    build:
      context: ..
      dockerfile: backend/inventory-service/Dockerfile
    container_name: ehos-inventory-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8514:8514"
    depends_on:
      postgres:
        condition: service_healthy

  workflow-service:
    build:
      context: ..
      dockerfile: backend/workflow-service/Dockerfile
    container_name: ehos-workflow-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8515:8515"
    depends_on:
      postgres:
        condition: service_healthy

  clinical-documentation-service:
    build:
      context: ..
      dockerfile: backend/clinical-documentation-service/Dockerfile
    container_name: ehos-clinical-documentation-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8516:8516"
    depends_on:
      postgres:
        condition: service_healthy

  insurance-service:
    build:
      context: ..
      dockerfile: backend/insurance-service/Dockerfile
    container_name: ehos-insurance-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8517:8517"
    depends_on:
      postgres:
        condition: service_healthy

  reporting-service:
    build:
      context: ..
      dockerfile: backend/reporting-service/Dockerfile
    container_name: ehos-reporting-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      EHOS_ENV: development
    ports:
      - "8518:8518"
    depends_on:
      postgres:
        condition: service_healthy

  # --- HospitalGPT (offline local AI platform) ---
  knowledge-service:
    build:
      context: ..
      dockerfile: backend/knowledge-service/Dockerfile
    container_name: ehos-knowledge-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      EMBEDDING_ADAPTER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      EMBEDDING_MODEL: all-minilm:l6-v2
      EHOS_ENV: development
    ports:
      - "8505:8505"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ..
      dockerfile: backend/ai-service/Dockerfile
    container_name: ehos-ai-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      INFERENCE_ADAPTER: ollama
      EMBEDDING_ADAPTER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:1b
      OLLAMA_EMBEDDING_MODEL: all-minilm:l6-v2
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8505
      EHOS_ENV: development
    ports:
      - "8506:8506"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      knowledge-service:
        condition: service_started

  prediction-service:
    build:
      context: ..
      dockerfile: backend/prediction-service/Dockerfile
    container_name: ehos-prediction-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      PREDICTION_DEFAULT_ADAPTER: seasonal_naive
      EHOS_ENV: development
    ports:
      - "8507:8507"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  analytics-service:
    build:
      context: ..
      dockerfile: backend/analytics-service/Dockerfile
    container_name: ehos-analytics-service
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-ehos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ehos-dev-only}
      EHOS_ENV: development
      DEFAULT_COUNTRY_CODE: ${DEFAULT_COUNTRY_CODE:-EG}
    ports:
      - "8508:8508"
    depends_on:
      postgres:
        condition: service_healthy

  # --- Monitoring (optional profile: docker compose --profile monitoring up -d) ---
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ehos-prometheus
    profiles: ["monitoring"]
    volumes:
      - ../monitoring/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ehos-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.1.0
    container_name: ehos-loki
    profiles: ["monitoring"]
    volumes:
      - ../monitoring/loki:/etc/loki:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yaml

  tempo:
    image: grafana/tempo:2.5.0
    container_name: ehos-tempo
    profiles: ["monitoring"]
    volumes:
      - ../monitoring/tempo:/etc/tempo:ro
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"
      - "9095:9095"
    command: -config.file=/etc/tempo/tempo.yaml

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  loki_data:
  tempo_data: