{{- range $name, $spec := .Values.services }}
{{- if $spec.hpa }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  namespace: {{ $spec.namespace }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $name }} }
  minReplicas: {{ $spec.hpa.min | int }}
  maxReplicas: {{ $spec.hpa.max | int }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $spec.hpa.cpu | int }} }
{{- end }}
{{- end }}