{{- range $name, $spec := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $spec.namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: ehos
    app.kubernetes.io/scrape: "true"
spec:
  replicas: {{ $spec.replicas | int }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $name }} }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: ehos
        app.kubernetes.io/scrape: "true"
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
      containers:
        - name: {{ $name }}
          image: {{ include "ehos.image" (merge (dict "image" $spec.image) $) }}
          ports:
            - { name: http, containerPort: {{ $spec.port | int }} }
          {{- if $spec.envFromSecrets }}
          envFrom:
            {{- range $spec.envFromSecrets }}
            - secretRef: { name: {{ . }} }
            {{- end }}
          {{- end }}
          {{- if $spec.env }}
          env:
            {{- toYaml $spec.env | nindent 12 }}
          {{- end }}
          {{- with $spec.probes }}
          readinessProbe:
            httpGet: { path: {{ .path }}, port: {{ .port }} }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: {{ .path }}, port: {{ .port }} }
            periodSeconds: 30
          {{- end }}
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 2, memory: 2Gi }
{{- end }}