{{- range $name, $spec := .Values.frontends }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $spec.namespace }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: ehos }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: {{ $name }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: ehos }
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "ehos.image" (merge (dict "image" $spec.image) $) }}
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe: { httpGet: { path: /healthz, port: 80 }, periodSeconds: 10 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $spec.namespace }}
  labels: { app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/part-of: ehos }
spec:
  selector: { app.kubernetes.io/name: {{ $name }} }
  ports: [{ name: http, port: 80, targetPort: http }]
{{- end }}