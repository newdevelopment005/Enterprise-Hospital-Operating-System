# minio.yaml — S3 object store (records, models, docs) in distributed mode on 4 drives.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: ehos-data
  labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: ehos }
spec:
  selector: { app.kubernetes.io/name: minio }
  ports:
    - { name: api, port: 9000 }
    - { name: console, port: 9001 }
---
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: ehos-data
  labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: ehos }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: minio }
  ports:
    - { name: api, port: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: ehos-data
  labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: ehos }
spec:
  serviceName: minio-headless
  replicas: 4
  podManagementPolicy: Parallel
  selector: { matchLabels: { app.kubernetes.io/name: minio } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: ehos }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-08-26T01-01-28Z
          args:
            - server
            - "--address=:9000"
            - "--console-address=:9001"
            - "http://minio-{0...3}.minio-headless.ehos-data.svc.cluster.local/data"
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: ehos-minio, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: ehos-minio, key: MINIO_ROOT_PASSWORD } } }
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          volumeMounts: [{ name: data, mountPath: /data }]
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 4, memory: 8Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ehos-fast
        resources: { requests: { storage: 100Gi } }
---
# mc admin Job: creates buckets used by services.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
  namespace: ehos-data
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-minio
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z minio 9000; do sleep 2; done"]
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-08-17T11-33-47Z
          command:
            - sh
            - -c
            - |
              mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
              for b in ehos-documents ehos-models ehos-embeddings ehos-audit; do
                mc mb --ignore-existing local/$$b
              done
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: ehos-minio, key: MINIO_ROOT_USER } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: ehos-minio, key: MINIO_ROOT_PASSWORD } } }