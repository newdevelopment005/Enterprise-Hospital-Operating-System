# 10-ingress.yaml — NGINX ingress-nginx controller + EHOS routing.
# Controller is installed as a helm dependency (infrastructure/helm); these are
# the Ingress resources and the class it should use.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: ehos-nginx
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: k8s.io/ingress-nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: ehos-platform
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: ehos-nginx
  tls:
    - hosts: [hospital.example.org]
      secretName: ehos-tls
  rules:
    - host: hospital.example.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: api-gateway, port: { name: http } } }
          - path: /realms
            pathType: Prefix
            backend: { service: { name: keycloak, port: { name: http } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ehr-portal
  namespace: ehos-clinical
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: ehos-nginx
  tls:
    - hosts: [hospital.example.org]
      secretName: ehos-tls
  rules:
    - host: hospital.example.org
      http:
        paths:
          - path: /ehr
            pathType: Prefix
            backend: { service: { name: ehr-portal, port: { name: http } } }
          - path: /register
            pathType: Prefix
            backend: { service: { name: patient-registration, port: { name: http } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dashboards
  namespace: ehos-platform
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: ehos-nginx
  tls:
    - hosts: [hospital.example.org]
      secretName: ehos-tls
  rules:
    - host: hospital.example.org
      http:
        paths:
          - path: /dash
            pathType: Prefix
            backend: { service: { name: executive-dashboard, port: { name: http } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-assistant
  namespace: ehos-ai
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: ehos-nginx
  tls:
    - hosts: [hospital.example.org]
      secretName: ehos-tls
  rules:
    - host: hospital.example.org
      http:
        paths:
          - path: /assistant
            pathType: Prefix
            backend: { service: { name: ai-assistant, port: { name: http } } }