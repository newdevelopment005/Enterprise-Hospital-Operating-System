# keycloak.yaml — OIDC identity provider (realm "ehos"), backed by postgres.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: ehos-platform
  labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: ehos }
spec:
  selector: { app.kubernetes.io/name: keycloak }
  ports:
    - { name: http, port: 8080 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
  namespace: ehos-platform
  labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: ehos }
spec:
  serviceName: keycloak
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: keycloak } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: keycloak, app.kubernetes.io/part-of: ehos }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: { matchLabels: { app.kubernetes.io/name: keycloak } }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          args: ["start", "--optimized", "--import-realm", "--proxy-headers=xforwarded", "--hostname-strict=false", "--http-enabled=true"]
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: ehos-keycloak, key: ADMIN_PASSWORD } } }
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: jdbc:postgresql://postgres.ehos-data.svc.cluster.local:5432/ehos_keycloak }
            - { name: KC_DB_USERNAME, valueFrom: { secretKeyRef: { name: ehos-postgres, key: POSTGRES_USER } } }
            - { name: KC_DB_PASSWORD, valueFrom: { secretKeyRef: { name: ehos-postgres, key: POSTGRES_PASSWORD } } }
            - { name: EHOS_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: ehos-keycloak, key: CLIENT_SECRET } } }
          volumeMounts:
            - { name: realm-import, mountPath: /opt/keycloak/data/import, readOnly: true }
          readinessProbe:
            httpGet: { path: /realms/ehos, port: 8080 }
            periodSeconds: 10
            timeoutSeconds: 10
            initialDelaySeconds: 30
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 2, memory: 4Gi }
  volumeClaimTemplates: []
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: ehos-platform
data:
  # Realm JSON lives in backend/identity-service/keycloak; mount it as a volume.
  README: "mount backend/identity-service/keycloak realm-export.json here"