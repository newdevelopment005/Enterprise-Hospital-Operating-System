# 11-cert-manager.yaml — TLS certificates for public endpoints.
# Operator is installed via helm (cert-manager); these are the Issuers + Certificate.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ehos-acme
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ops@hospital.example.org
    privateKeySecretRef: { name: ehos-acme-account-key }
    solvers:
      - http01:
          ingress:
            class: ehos-nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ehos-acme-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ops@hospital.example.org
    privateKeySecretRef: { name: ehos-acme-staging-account-key }
    solvers:
      - http01:
          ingress:
            class: ehos-nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ehos-tls
  namespace: ehos-platform
spec:
  secretName: ehos-tls
  issuerRef: { name: ehos-acme, kind: ClusterIssuer }
  commonName: hospital.example.org
  dnsNames:
    - hospital.example.org
  usages: [server auth]
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: ehos-platform
spec:
  secretName: keycloak-tls
  issuerRef: { name: ehos-acme, kind: ClusterIssuer }
  dnsNames:
    - hospital.example.org