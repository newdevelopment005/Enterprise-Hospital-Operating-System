# app-services.yaml — EHOS platform, clinical and AI backend Deployments.
# Every service: Deployment + Service + HPA. Image from REGISTRY (see CI/CD).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ehos-platform
  labels: { app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: ehos }
spec:
  replicas: 3
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api-gateway, app.kubernetes.io/part-of: ehos }
    spec:
      imagePullSecrets: [{ name: ehos-registry }]
      containers:
        - name: api-gateway
          image: ${REGISTRY}/api-gateway:${TAG}
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: kafka.ehos-data.svc:9092 }
            - { name: REDIS_HOST, value: redis.ehos-data.svc }
            - { name: KEYCLOAK_URL, value: http://keycloak.ehos-platform.svc:8080 }
            - { name: KEYCLOAK_REALM, value: ehos }
            - { name: EHOS_ENV, value: production }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 2, memory: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ehos-platform
  labels: { app.kubernetes.io/name: api-gateway }
spec:
  selector: { app.kubernetes.io/name: api-gateway }
  ports: [{ name: http, port: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: ehos-platform
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
# --- configuration-service (ehos-platform) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configuration-service
  namespace: ehos-platform
  labels: { app.kubernetes.io/name: configuration-service }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: configuration-service } }
  template:
    metadata: { labels: { app.kubernetes.io/name: configuration-service, app.kubernetes.io/part-of: ehos } }
    spec:
      imagePullSecrets: [{ name: ehos-registry }]
      containers:
        - name: configuration-service
          image: ${REGISTRY}/configuration-service:${TAG}
          ports: [{ name: http, containerPort: 8100 }]
          env:
            - { name: POSTGRES_HOST, value: postgres.ehos-data.svc }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: ehos-postgres, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: ehos-postgres, key: POSTGRES_PASSWORD } } }
            - { name: REDIS_HOST, value: redis.ehos-data.svc }
            - { name: KAFKA_BOOTSTRAP_SERVERS, value: kafka.ehos-data.svc:9092 }
            - { name: EHOS_ENV, value: production }
          readinessProbe: { httpGet: { path: /health, port: 8100 }, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 1, memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: configuration-service
  namespace: ehos-platform
  labels: { app.kubernetes.io/name: configuration-service }
spec:
  selector: { app.kubernetes.io/name: configuration-service }
  ports: [{ name: http, port: 8100 }]
---
