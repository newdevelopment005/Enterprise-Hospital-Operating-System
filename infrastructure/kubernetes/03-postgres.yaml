# postgres.yaml — PostgreSQL 16 system of record (per-service databases from
# database/init). Single primary StatefulSet with durability + a scheduled
# pg_dump backup (see 15-backup.yaml). For active HA use the Patroni / CloudNativePG
# dependency listed in infrastructure/helm/ehos-platform/Chart.yaml.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ehos-data
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: ehos }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - { name: postgres, port: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ehos-data
  labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: ehos }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: postgres } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: ehos }
    spec:
      securityContext: { fsGroup: 999 }
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: ehos-postgres, key: POSTGRES_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: ehos-postgres, key: POSTGRES_PASSWORD } } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 15
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 4, memory: 8Gi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ehos-fast
        resources: { requests: { storage: 100Gi } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: ehos-data
data:
  # from database/init/001_create_databases.sql — mounted by StatefulSet when available
  README: "see database/init in repository root"