# 16-network-policies.yaml — zero-trust segmentation (SECURITY.md).
# Default-deny per EHOS namespace; only explicit paths allowed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ehos-platform
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ehos-clinical
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ehos-ai
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: ehos-data
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Allow ingress controller -> api-gateway -> everything else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ingress-to-gateway
  namespace: ehos-platform
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: api-gateway } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ehos-monitoring } }
      ports: [{ port: 8000 }]
---
# Gateway is the only client of data plane services + keycloak.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-plane
  namespace: ehos-data
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ehos-platform } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ehos-clinical } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ehos-ai } }