# secrets.example.yaml — TEMPLATE ONLY (values are Base64 placeholders).
# Manage real values with a secret manager (Vault / SOPS / sealed-secrets) and
# reference them by name; these are the secret names Helm templates expect.
#   echo -n 'changeme' | base64 -w0   # to produce a value
apiVersion: v1
kind: Secret
metadata:
  name: ehos-postgres
  namespace: ehos-data
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me-postgres"
  POSTGRES_USER: "ehos"
---
apiVersion: v1
kind: Secret
metadata:
  name: ehos-redis
  namespace: ehos-data
type: Opaque
stringData:
  REDIS_PASSWORD: "change-me-redis"
---
apiVersion: v1
kind: Secret
metadata:
  name: ehos-minio
  namespace: ehos-data
type: Opaque
stringData:
  MINIO_ROOT_USER: "ehos"
  MINIO_ROOT_PASSWORD: "change-me-minio"
---
apiVersion: v1
kind: Secret
metadata:
  name: ehos-keycloak
  namespace: ehos-platform
type: Opaque
stringData:
  ADMIN_PASSWORD: "change-me-keycloak"
  CLIENT_SECRET: "change-me-client-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: ehos-grafana
  namespace: ehos-monitoring
type: Opaque
stringData:
  admin-password: "change-me-grafana"
---
apiVersion: v1
kind: Secret
metadata:
  name: ehos-registry
  namespace: ehos-platform
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"REGISTRY_HOST":{"username":"REGISTRY_USER","password":"REGISTRY_TOKEN","auth":"bm90LXJlYWw6YmFzZTY0"}}}'
---
apiVersion: v1
kind: Secret
metadata:
  name: ehos-backup
  namespace: ehos-backup
type: Opaque
stringData:
  BACKUP_TARGET_S3_ENDPOINT: "https://backup-server.internal/health"
  BACKUP_TARGET_ACCESS_KEY: "change-me"
  BACKUP_TARGET_SECRET_KEY: "change-me"
  BACKUP_TARGET_BUCKET: "ehos-backups"
  AGE_KEY: "change-me-age-identity"

# apply: kubectl apply -k infrastructure/kubernetes (sealed-secrets in production)