# 14-gpu.yaml — GPU inference server (vLLM) for the offline AI plane.
# Requires NVIDIA device plugin + NFD on the GPU node; never exposed publicly.
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: ehos-ai
  labels: { app.kubernetes.io/name: inference }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: inference }
  ports:
    - { name: openai, port: 8001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: inference
  namespace: ehos-ai
  labels: { app.kubernetes.io/name: inference }
spec:
  serviceName: inference
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: inference } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: inference, app.kubernetes.io/part-of: ehos }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
    spec:
      nodeSelector:
        nvidia.com/gpu.node: "true"
      tolerations:
        - { key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }
      containers:
        - name: vllm
          image: vllm/vllm-openai:latest
          args:
            - "--model"
            - "$(LLM_MODEL)"
            - "--port"
            - "8001"
            - "--gpu-memory-utilization"
            - "0.90"
          ports: [{ name: openai, containerPort: 8001 }]
          env:
            - { name: LLM_MODEL, value: "Qwen/Qwen2.5-14B-Instruct" }
            - { name: HF_HOME, value: /models/hf }
          volumeMounts:
            - { name: models, mountPath: /models }
          resources:
            limits:
              nvidia.com/gpu: "1"
              cpu: "16"
              memory: 64Gi
            requests:
              nvidia.com/gpu: "1"
              cpu: "8"
              memory: 32Gi
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 30
            timeoutSeconds: 10
            initialDelaySeconds: 120
        - name: dcgm-exporter
          image: nvidia/dcgm-exporter:3.3.5
          ports: [{ name: metrics, containerPort: 9400 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
  volumeClaimTemplates:
    - metadata: { name: models }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ehos-fast
        resources: { requests: { storage: 200Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference
  namespace: ehos-ai
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: inference } }