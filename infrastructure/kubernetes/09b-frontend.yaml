# frontend.yaml — SPA deployments (nginx images built in CI from frontend/apps/*/dist).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehr-portal
  namespace: ehos-clinical
  labels: { app.kubernetes.io/name: ehr-portal }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: ehr-portal } }
  template:
    metadata: { labels: { app.kubernetes.io/name: ehr-portal, app.kubernetes.io/part-of: ehos } }
    spec:
      imagePullSecrets: [{ name: ehos-registry }]
      containers:
        - name: web
          image: ${REGISTRY}/frontend-ehr-portal:${TAG}
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe: { httpGet: { path: /healthz, port: 80 }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: ehr-portal
  namespace: ehos-clinical
  labels: { app.kubernetes.io/name: ehr-portal }
spec:
  selector: { app.kubernetes.io/name: ehr-portal }
  ports: [{ name: http, port: 80 }]
---
